[package]
name = "transfer-app"
version = "0.5.0"
edition = "2021"
description = "Transfer: automatic, on-device sorting for Desktop, Downloads and Documents"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
transfer-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Fast CI builds; the app is small either way.
strip = true
opt-level = "s"
