[package]
name = "transfer-app"
version = "0.1.0"
edition = "2021"
description = "Transfer: automatic, on-device sorting for Desktop, Downloads and Documents"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
transfer-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
