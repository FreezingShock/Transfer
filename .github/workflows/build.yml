name: Build Transfer

# Every push to main builds Windows and macOS (a compile check + downloadable
# artifacts). A Release is published only when the version in
# src-tauri/tauri.conf.json is new, and only after BOTH platforms succeed, so a
# release always carries the Windows .exe/.msi and the macOS .dmg together.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - run: npx tauri build
      - name: Portable exe (no installer)
        shell: bash
        run: cp src-tauri/target/release/transfer-app.exe src-tauri/target/release/Transfer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-windows
          path: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      # one .dmg for both Apple Silicon and Intel Macs
      - run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this a new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          path: dist
      - name: Publish release (Windows + macOS)
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Transfer ${{ steps.ver.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            **Windows:** `Transfer.exe` runs without installing; `*-setup.exe` or `.msi` installs it.
            **Mac:** `Transfer_*_universal.dmg` (Apple Silicon and Intel). First launch: right-click the app → Open (it isn't notarized yet).
          files: |
            dist/Transfer-windows/**/*.exe
            dist/Transfer-windows/**/*.msi
            dist/Transfer-macos/**/*.dmg
