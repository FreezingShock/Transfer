name: Build Transfer

# Every push to main (and every pull request) runs the engine tests and the UI
# CSP check, and builds Windows and macOS. A Release is published only from
# main, only when the version in src-tauri/tauri.conf.json is new, and only
# after the tests AND both platforms succeed, so a release always carries the
# Windows .exe/.msi and the macOS .dmg together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same PR cancels the older run (frees the macOS runner queue).
# Runs on main are never cancelled, so a release always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Version is the same in all three places
        run: |
          A=$(node -p "require('./src-tauri/tauri.conf.json').version")
          B=$(node -p "require('./package.json').version")
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$A package.json=$B Cargo.toml=$C"
          test "$A" = "$B" && test "$A" = "$C"
      - name: Engine tests
        run: cargo test --workspace
      - name: UI renders its colors under the app CSP
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/ui-csp-check.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # PRs restore main's cache but don't save their own (saves ~30 s per run).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Signed update files (for in-app updates) when the signing key secret exists; plain build otherwise.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'; else npx tauri build; fi
      - name: Portable exe (no installer)
        shell: bash
        run: cp src-tauri/target/release/transfer-app.exe src-tauri/target/release/Transfer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-windows
          path: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # PRs restore main's cache but don't save their own (saves ~30 s per run).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # PRs: one arch, .app only (about half the compile, no dmg, no signing). Reuses the arm64 objects main caches.
      - name: Build (PR check, Apple Silicon only)
        if: github.event_name == 'pull_request'
        run: npx tauri build --target aarch64-apple-darwin --bundles app
      # main: one .dmg for both Apple Silicon and Intel Macs
      - name: Build (universal)
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'; else npx tauri build --target universal-apple-darwin; fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Transfer-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: [test, windows, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this a new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          path: dist
      - name: Build latest.json (in-app updater manifest)
        if: steps.ver.outputs.new == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          WIN=$(find dist/Transfer-windows -name '*-setup.exe' | head -1)
          MAC=$(find dist/Transfer-macos -name '*.app.tar.gz' | head -1)
          if [ -n "$WIN" ] && [ -f "$WIN.sig" ] && [ -n "$MAC" ] && [ -f "$MAC.sig" ]; then
            BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
            node -e '
              const fs=require("fs"),[v,base,win,mac]=process.argv.slice(1),b=p=>require("path").basename(p);
              const e=(f,sig)=>({signature:fs.readFileSync(sig,"utf8").trim(),url:base+"/"+b(f)});
              const w=e(win,win+".sig"),m=e(mac,mac+".sig");
              fs.writeFileSync("dist/latest.json",JSON.stringify({version:v,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":w,"darwin-aarch64":m,"darwin-x86_64":m}},null,2));
            ' "$V" "$BASE" "$WIN" "$MAC"
            cat dist/latest.json
          else
            echo "::warning::No signed update files (TAURI_SIGNING_PRIVATE_KEY secret missing?). Releasing without latest.json; in-app updates will not see this version."
          fi
      - name: Release has the Windows and macOS installers
        if: steps.ver.outputs.new == 'true'
        run: |
          # find, not ls with **: bash has no globstar here, and artifact folders nest differently per platform.
          find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \)
          for pat in 'Transfer.exe' '*-setup.exe' '*.msi' '*.dmg'; do
            test -n "$(find dist -type f -name "$pat" | head -1)" || { echo "::error::missing $pat"; exit 1; }
          done
      - name: Publish release (Windows + macOS)
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Transfer ${{ steps.ver.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            **Windows:** `Transfer.exe` runs without installing; `*-setup.exe` or `.msi` installs it.
            **Mac:** `Transfer_*_universal.dmg` (Apple Silicon and Intel). First launch: right-click the app → Open (it isn't notarized yet).
          files: |
            dist/Transfer-windows/**/*.exe
            dist/Transfer-windows/**/*.msi
            dist/Transfer-macos/**/*.dmg
            dist/Transfer-macos/**/*.app.tar.gz
            dist/Transfer-macos/**/*.app.tar.gz.sig
            dist/Transfer-windows/**/*.sig
            dist/latest.json
