name: Build Transfer (Windows)

# Every push to main: compile check + downloadable build artifact.
# A Release is published ONLY when the version in src-tauri/tauri.conf.json is new
# (no release v<version> exists yet), and only after the Windows build succeeds,
# so a release always has all its files.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS .dmg"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - run: npx tauri build
      - name: Portable exe (no installer)
        shell: bash
        run: cp src-tauri/target/release/transfer-app.exe src-tauri/target/release/Transfer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-windows
          path: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release (new versions only)
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Transfer ${{ steps.ver.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
