name: Build Transfer (Windows)

# Every push to main: compile check + downloadable build artifact.
# A Release is published ONLY when a version tag (v0.1.2, ...) is pushed,
# and only after the Windows build succeeds, so it always has all its files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS .dmg"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - run: npx tauri build
      - name: Portable exe (no installer)
        shell: bash
        run: cp src-tauri/target/release/transfer-app.exe src-tauri/target/release/Transfer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-windows
          path: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Transfer ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/Transfer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Transfer-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
