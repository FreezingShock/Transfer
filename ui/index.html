<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfer</title>
<style>
/* Liquid glass. In the app the window itself is OS acrylic/vibrancy, so the
   desktop blurs through; in a browser a wallpaper stands in behind a glass card. */
:root{
  --fg:#fff; --fg-2:rgba(255,255,255,.74); --fg-3:rgba(255,255,255,.6);
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.14); --glass-3:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.22); --hair:rgba(255,255,255,.12);
  --ink:#0a1236; --solid:rgba(255,255,255,.9);
  --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --e:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;
  background:#0a1236;background-image:radial-gradient(60% 50% at 18% 22%,#2f6bff 0%,transparent 60%),radial-gradient(55% 45% at 85% 30%,#7b3cff 0%,transparent 62%),radial-gradient(70% 55% at 60% 95%,#00b3ff 0%,transparent 60%),radial-gradient(40% 35% at 10% 90%,#ff5fa2 0%,transparent 60%)}
body:not(.native){display:flex;align-items:center;justify-content:center;padding:16px}
html.native,html.native body{background:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:16px;height:16px;flex:none}
.row>svg{width:13px;height:13px}
.search svg,.note svg{width:14px;height:14px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.win{position:relative;width:360px;height:min(640px,100%);display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;border-radius:24px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 30px 80px rgba(3,8,40,.45);overflow:hidden}
.native .win{width:100%;height:100%;border-radius:0;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  background:rgba(14,22,60,.28);-webkit-backdrop-filter:none;backdrop-filter:none}

.top{display:flex;align-items:center;gap:8px;min-height:26px}
.lights{display:flex;gap:7px}
.lights button{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lights svg{opacity:0;width:8px;height:8px}
.lights:hover svg{opacity:.7}
.l-r{background:#ff5f57}.l-y{background:#febc2e}.l-g{background:#28c840}
.drag{flex:1;align-self:stretch}
.chip{background:var(--glass-2);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.live{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.live.off i{background:var(--orange);box-shadow:none}

.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.h1{font-size:22px;font-weight:600;letter-spacing:-.3px;padding:0 4px}
.sub{font-size:12.5px;color:var(--fg-2);padding:0 4px}
.big{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.big b{font-size:40px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big span{font-size:15px;color:rgba(255,255,255,.82)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:0 6px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:12px;text-align:left;width:100%;transition:background-color 150ms}
.row:hover{background:rgba(255,255,255,.08)}
.ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--t,rgba(255,255,255,.16))}
.ic svg{width:16px;height:16px}
.ic.sm{width:26px;height:26px;border-radius:8px}.ic.sm svg{width:14px;height:14px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:11.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .undo{display:none}
.row:hover .undo,.row:focus-within .undo{display:inline-flex}
.row:hover .when,.row:focus-within .when{display:none}
.row.undone{opacity:.5}.row.undone b{text-decoration:line-through}

.pill{height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:600;align-items:center;justify-content:center;display:inline-flex}
.solid{background:var(--solid);color:var(--ink)}
.ghost{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);font-weight:500}
.btn{height:36px;border-radius:18px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform 150ms var(--e)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default}

.group{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;flex-direction:column}
.group>*+*{border-top:1px solid var(--hair)}
.set{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px}
.set>span:first-child:not(.ic),.set>.ic+span{flex:1}
.set output{width:36px;text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}
input[type=range]{accent-color:#fff;width:110px}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.22);position:relative;cursor:pointer;flex:none;transition:background-color 200ms}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 220ms var(--e)}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(16px)}

.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid button{height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:background-color 150ms}
.grid button:hover{background:rgba(255,255,255,.12)}
.grid button[aria-pressed=true]{background:var(--glass-3);border-color:rgba(255,255,255,.5)}
.grid svg{width:16px;height:16px}

.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:12px}
.search input{flex:1;border:0;background:transparent;font-size:13px;outline:none;user-select:text}
.search input::placeholder{color:var(--fg-3)}

.foot{display:flex;align-items:center;gap:8px}
nav.tabs{display:flex;gap:2px;padding:3px;border-radius:16px;flex:1}
nav.tabs a{position:relative;flex:1;height:32px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;transition:background-color 150ms}
nav.tabs a[aria-current=page]{background:var(--glass-3)}
nav.tabs a svg{width:17px;height:17px}
.badge{position:absolute;top:3px;left:calc(50% + 4px);min-width:15px;height:15px;border-radius:8px;background:var(--red);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 3px}

.note{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:12px;color:var(--fg-2)}
.empty{padding:28px 12px;text-align:center;color:var(--fg-2);font-size:12.5px}

.sheet{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:46px 14px 14px;background:rgba(14,22,62,.86);z-index:5;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);animation:fade 260ms var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.toast{position:absolute;left:14px;right:14px;bottom:62px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:16px;font-size:12.5px;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.24);animation:fade 260ms var(--e)}
.toast span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fresh{animation:fresh 1.2s var(--e)}
@keyframes fresh{from{background:rgba(255,255,255,.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="win" id="win">
  <div class="top" data-tauri-drag-region>
    <div class="lights">
      <button class="l-r" id="bClose" aria-label="Close to tray"><svg viewBox="0 0 10 10" stroke="#4d0000" stroke-width="1.6"><path d="M2 2l6 6M8 2L2 8"/></svg></button>
      <button class="l-y" id="bMin" aria-label="Minimize"><svg viewBox="0 0 10 10" stroke="#5a3a00" stroke-width="1.6"><path d="M2 5h6"/></svg></button>
      <button class="l-g" id="bTop" aria-label="Keep on top"><svg viewBox="0 0 10 10" stroke="#00400a" stroke-width="1.6"><path d="M5 2v6M2 5h6"/></svg></button>
    </div>
    <div class="drag" data-tauri-drag-region></div>
    <div id="topRight"></div>
  </div>
  <div class="body" id="view"></div>
  <div class="foot" id="foot"></div>
  <div id="layer"></div>
</main>
<script src="app.js"></script>
</body>
</html>
