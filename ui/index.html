<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfer</title>
<style>
/* Liquid glass, v0.3. Window = OS acrylic (in the app) under a theme tint.
   Motion: spring + bounce curves; everything settles in under ~420ms. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  /* springs sampled from Apple-style params: snappy = damping .85 / stiffness 900 (presses, selection),
     smooth = critically damped (sheets, screens), gel = damping .72 (small droplets) */
  --snappy:linear(0,.073,.219,.382,.553,.68,.78,.855,.909,.95,.974,.988,.997,1.001,1.003,1.004,1.004,1.003,1.003,1.002,1.001,1.001,1.001,1,1);
  --smooth:linear(0,.077,.213,.372,.516,.636,.724,.798,.854,.893,.923,.946,.96,.972,.98,.986,.99,.993,.995,.997,.998,.998,.999,.999,1);
  --gel:linear(0,.088,.268,.486,.665,.807,.909,.975,1.015,1.031,1.035,1.032,1.025,1.018,1.012,1.007,1.003,1.001,.999,.999,.999,.999,.999,.999,1);
  --out:cubic-bezier(.22,1,.36,1);
  --acc:#8e8cf5;
  /* dark (default) */
  --tint:rgba(14,16,30,.66); --fg:#fff; --fg2:rgba(255,255,255,.8); --fg3:rgba(255,255,255,.6);
  --s1:rgba(255,255,255,.07); --s2:rgba(255,255,255,.12); --s3:rgba(255,255,255,.2);
  --edge:rgba(255,255,255,.16); --hair:rgba(255,255,255,.09); --hi:rgba(255,255,255,.28);
  --solid:#fff; --solid-ink:#101220; --shadow:0 30px 80px rgba(0,0,10,.5);
  color-scheme:dark;
}
[data-theme=light]{
  --tint:rgba(248,248,252,.72); --fg:#0d1020; --fg2:rgba(13,16,32,.74); --fg3:rgba(13,16,32,.58);
  --s1:rgba(255,255,255,.45); --s2:rgba(255,255,255,.6); --s3:rgba(255,255,255,.85);
  --edge:rgba(255,255,255,.7); --hair:rgba(13,16,32,.08); --hi:rgba(255,255,255,.9);
  --solid:#101220; --solid-ink:#fff; --shadow:0 30px 80px rgba(20,20,60,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;background:#1a0e08}
body:not(.native){display:flex;align-items:center;justify-content:center;padding:16px}
.wall{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(70% 45% at 50% 0%,#ffb238 0%,transparent 70%),
  radial-gradient(60% 50% at 80% 35%,#ff6a2b 0%,transparent 65%),
  linear-gradient(180deg,#ffcf5a 0%,#f2702a 35%,#8a2a1a 62%,#2a0d10 100%)}
.wall.blue{background:#0a1236;background-image:radial-gradient(60% 50% at 18% 22%,#2f6bff 0%,transparent 60%),radial-gradient(55% 45% at 85% 30%,#7b3cff 0%,transparent 62%),radial-gradient(70% 55% at 60% 95%,#00b3ff 0%,transparent 60%)}
.native .wall{display:none}
html.native,html.native body{background:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:16px;height:16px;flex:none}

.win{position:relative;width:440px;height:min(700px,100%);display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;border-radius:26px;
  background:var(--tint);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--shadow);overflow:hidden;transition:background-color .4s}
.native .win{width:100%;height:100%;border-radius:0;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 var(--hi)}

/* press: like Liquid Glass, controls swell slightly and light up under the finger (JS sets the scale) */
.press{position:relative;transition:transform .33s var(--snappy),background-color .2s,box-shadow .2s,color .2s}
.press.down{transition:transform .18s var(--snappy)}
.press::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 65%)}
.press.down::after{opacity:1;transition:opacity .08s}
[data-theme=light] .press::after{background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75),transparent 65%)}

.top{display:flex;align-items:center;gap:8px;min-height:26px}
.lights{display:flex;gap:7px}
.lights button{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lights svg{opacity:0;width:8px;height:8px;transition:opacity .15s}
.lights:hover svg{opacity:.75}
.l-r{background:#ff5f57}.l-y{background:#febc2e}.l-g{background:#28c840}
/* Windows: controls live top-right, close outermost (minimize, on-top, close) */
.os-win .top{flex-direction:row-reverse}
.os-win .lights{flex-direction:row-reverse}
.drag{flex:1;align-self:stretch}
.glass{background:var(--s1);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.live{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:breathe 2.4s ease-in-out infinite}
.live.off i{background:#ff9f0a;animation:none}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(48,209,88,0)}}

/* segmented bars with a liquid indicator */
.seg{position:relative;display:flex;gap:2px;padding:3px;border-radius:16px}
.seg>button,.seg>a{position:relative;z-index:1;flex:1;min-width:0;height:32px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--fg2);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:color .25s}
.seg>[aria-current=page],.seg>[aria-pressed=true]{color:var(--fg)}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:13px;background:var(--s3);will-change:left,width,transform;
  box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.12)}
.seg.small>button{height:26px;font-size:12px}
.folders{overflow-x:auto;scrollbar-width:none;flex:none;max-height:44px;transition:max-height .38s var(--out),opacity .22s ease,margin .38s var(--out),padding .38s var(--out),border-width .38s}
.folders.hidden{max-height:0;opacity:0;margin-top:-12px;padding-top:0;padding-bottom:0;border-width:0;pointer-events:none}
.folders::-webkit-scrollbar{display:none}
.folders>button{flex:0 0 auto;padding:0 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.folders>.add{flex:0 0 32px;padding:0}

.view{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.in-r{animation:inR .45s var(--smooth)}
.screen.in-l{animation:inL .45s var(--smooth)}
.screen.in-f{animation:inF .32s var(--out)}
@keyframes inR{from{opacity:0;transform:translateX(14px)}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}}
@keyframes inF{from{opacity:0;transform:translateY(6px)}}

.h1{font-size:22px;font-weight:650;letter-spacing:-.3px}
.sub{font-size:12.5px;color:var(--fg2)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:42px;font-weight:650;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.big span{font-size:14.5px;color:var(--fg2)}
.label{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:0 6px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 4px}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:11px;border-radius:16px;text-align:left}
.fcard b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.fcard span{font-size:12px;color:var(--fg2)}
.fcard .top2{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--fg)}
.fcard .mode{font-size:11px;color:var(--fg3)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:13px;text-align:left;width:100%;transition:background-color .15s,height .3s var(--out),opacity .25s,padding .3s}
.row:hover{background:var(--s1)}
.row.enter{animation:drop .45s var(--smooth) both;animation-delay:calc(var(--i,0) * 28ms)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.row.fresh{animation:fresh 1.4s var(--out)}
@keyframes fresh{from{background:color-mix(in srgb,var(--acc) 30%,transparent)}}
.row.gone{height:0!important;opacity:0;padding-top:0;padding-bottom:0;overflow:hidden}
.ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  background:color-mix(in srgb,var(--lc) 20%,transparent);border:1px solid color-mix(in srgb,var(--lc) 26%,transparent)}
.ic svg{stroke:var(--lc)}
[data-theme=light] .ic svg{stroke:var(--ld)}
.ic.sm{width:26px;height:26px;border-radius:8px}.ic.sm svg{width:14px;height:14px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt b{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .undo{display:none}
.row:hover .undo,.row:focus-within .undo{display:inline-flex;animation:pop .4s var(--gel)}
.row:hover .when,.row:focus-within .when{display:none}
@keyframes pop{from{transform:scale(.8,.6);opacity:0}}

.pill{height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:650;align-items:center;justify-content:center;display:inline-flex}
.solid{background:var(--solid);color:var(--solid-ink)}
.acc{background:var(--acc);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.ghost{background:var(--s1);border:1px solid var(--edge);font-weight:550}
.btn{height:38px;border-radius:19px;font-size:13px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:default}

.group{border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.group>*+*{border-top:1px solid var(--hair)}
.set{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:13px;width:100%;text-align:left}
.set .grow{flex:1;min-width:0}
.set output,.set .val{color:var(--fg2);font-variant-numeric:tabular-nums;font-size:12.5px}
input[type=range]{accent-color:var(--acc);width:120px}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:42px;height:24px;border-radius:12px;background:var(--s3);position:relative;cursor:pointer;flex:none;transition:background-color .25s;box-shadow:inset 0 0 0 1px var(--edge)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);
  transition:left .33s var(--snappy),width .22s var(--snappy),height .22s var(--snappy),top .22s var(--snappy)}
.sw:active::after{width:26px;height:18px;top:3px}
.sw:checked{background:#30d158}
.sw:checked::after{left:20px}
.sw:checked:active::after{left:14px}

.card{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid button{height:54px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--fg2);
  background:var(--s1);border:1px solid var(--hair)}
.grid button svg{stroke:var(--lc)}
[data-theme=light] .grid button svg{stroke:var(--ld)}
.grid button[aria-pressed=true]{background:color-mix(in srgb,var(--lc) 24%,transparent);border-color:color-mix(in srgb,var(--lc) 60%,transparent);color:var(--fg)}
.grid.off button[aria-pressed=false]{opacity:.55}

.banner{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:16px;
  background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.banner span{flex:1;font-size:12.5px}

.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:12px}
.search input{flex:1;border:0;background:transparent;font-size:13px;outline:none;user-select:text}
.search input::placeholder{color:var(--fg3)}
.search svg{stroke:var(--fg3);width:14px;height:14px}

.foot{display:flex;align-items:center;gap:8px}
.foot .seg{flex:1}
#bSweep[hidden]{display:none}
.foot .seg a svg{width:17px;height:17px}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:8px;background:#ff453a;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;animation:pop .45s var(--gel)}
.note{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:12px;color:var(--fg2)}
.note svg{width:14px;height:14px}
.empty{padding:30px 16px;text-align:center;color:var(--fg2);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:28px;height:28px;stroke:var(--fg3)}

.scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.18);animation:fadeIn .25s ease both}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 40px);z-index:6;display:flex;flex-direction:column;gap:14px;padding:16px 14px 14px;border-radius:24px;
  background:var(--tint);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 -10px 40px rgba(0,0,0,.25);
  animation:rise .5s var(--smooth) both;transform-origin:50% 100%}
[data-theme=dark] .sheet{background:rgba(20,22,40,.92)}
[data-theme=light] .sheet{background:rgba(250,250,255,.94)}
.sheet.out{animation:sink .22s ease-in both}
.scrim.out{animation:fadeOut .22s ease-in both}
@keyframes rise{from{transform:translateY(36px);opacity:0}}
@keyframes sink{to{transform:translateY(30px) scale(.98);opacity:0}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.sheet .scroll{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:12px;min-height:0}
.grip{width:36px;height:5px;border-radius:3px;background:var(--s3);align-self:center;margin-top:-6px}
.path{font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:absolute;left:14px;right:14px;bottom:64px;z-index:7;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:18px;font-size:12.5px;font-weight:550;
  background:var(--solid);color:var(--solid-ink);box-shadow:0 12px 30px rgba(0,0,0,.3);transform-origin:50% 100%}
.toast.out{animation:sink .2s ease-in both}
.toast span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:650;background:color-mix(in srgb,var(--solid-ink) 14%,transparent)}

.demo-bar{position:fixed;bottom:max(10px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
body:not(.native){padding-bottom:52px}
.native .demo-bar{display:none}
.demo-bar button{height:28px;padding:0 10px;border-radius:14px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<div class="demo-bar" aria-label="Prototype controls">
  <button id="dWall">Wallpaper</button>
  <button id="dFile">Simulate a download</button>
</div>
<main class="win" id="win">
  <div class="top" data-tauri-drag-region>
    <div class="lights">
      <button class="l-r" id="bClose" aria-label="Close to tray"><svg viewBox="0 0 10 10" stroke="#4d0000" stroke-width="1.6"><path d="M2 2l6 6M8 2L2 8"/></svg></button>
      <button class="l-y" id="bMin" aria-label="Minimize"><svg viewBox="0 0 10 10" stroke="#5a3a00" stroke-width="1.6"><path d="M2 5h6"/></svg></button>
      <button class="l-g" id="bTop" aria-label="Keep on top"><svg viewBox="0 0 10 10" stroke="#00400a" stroke-width="1.6"><path d="M5 2v6M2 5h6"/></svg></button>
    </div>
    <div class="drag" data-tauri-drag-region></div>
    <button class="glass live press" id="bLive"><i></i><span>Live</span></button>
  </div>
  <nav class="seg glass folders" id="folders" aria-label="Folders"></nav>
  <div class="view" id="view"></div>
  <div class="foot">
    <nav class="seg glass" id="tabs" aria-label="Sections"></nav>
    <button class="btn acc press" id="bSweep">Sweep</button>
  </div>
  <div id="layer"></div>
</main>
<script src="app.js"></script>
</body>
</html>
